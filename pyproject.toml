[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-vggt"
version = "0.1.0"
description = "Reproducible human-centric feature transfer experiments for VGGT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "pillow>=10,<13",
    "PyYAML>=6,<7",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
models = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "safetensors>=0.5,<1",
    "huggingface-hub>=0.33,<2",
    "einops>=0.8,<1",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["upstream: opt-in tests with real model weights"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
